<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Tracker | Secure Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="stars"></div>
    <div class="container">
        <!-- Auth Card -->
        <div class="auth-card glass" id="auth-card">
            <div class="card-header">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <h1>Locate<span>X</span></h1>
                </div>
                <p id="card-description">Welcome back! Please enter your details.</p>
            </div>

            <!-- Views Container -->
            <div class="view-container">
                <!-- Login View -->
                <form id="login-view" class="auth-view active">
                    <div class="input-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="name@company.com" required>
                    </div>
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <div class="form-options">
                        <a href="#" id="to-forgot-password" class="text-link">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn-primary" id="login-btn">
                        <span class="btn-text">Sign In</span>
                        <div class="loader"></div>
                    </button>
                    <div class="divider"><span>OR</span></div>
                    <button type="button" class="btn-google" id="google-login-btn">
                        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google Logo">
                        <span>Continue with Google</span>
                    </button>
                    <p class="footer-text">Don't have an account? <a href="#" id="to-signup" class="text-link">Sign
                            up</a></p>
                </form>

                <!-- Signup View -->
                <form id="signup-view" class="auth-view">
                    <div class="input-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" placeholder="name@company.com" required>
                    </div>
                    <button type="submit" class="btn-primary" id="signup-btn">
                        <span class="btn-text">Get Started</span>
                        <div class="loader"></div>
                    </button>
                    <p class="footer-text">Already have an account? <a href="#" id="to-login" class="text-link">Sign
                            in</a></p>
                </form>

                <!-- OTP View -->
                <form id="otp-view" class="auth-view">
                    <div class="otp-header">
                        <h2>Verification Code</h2>
                        <p>We've sent a 6-digit code to <span id="display-email"></span></p>
                    </div>
                    <div class="otp-inputs">
                        <input type="text" maxlength="1" class="otp-digit" data-index="0">
                        <input type="text" maxlength="1" class="otp-digit" data-index="1">
                        <input type="text" maxlength="1" class="otp-digit" data-index="2">
                        <input type="text" maxlength="1" class="otp-digit" data-index="3">
                        <input type="text" maxlength="1" class="otp-digit" data-index="4">
                        <input type="text" maxlength="1" class="otp-digit" data-index="5">
                    </div>
                    <button type="submit" class="btn-primary" id="verify-otp-btn">
                        <span class="btn-text">Verify Code</span>
                        <div class="loader"></div>
                    </button>
                    <p class="footer-text">Didn't receive code? <a href="#" id="resend-otp" class="text-link">Resend</a>
                    </p>
                </form>

                <!-- Set/Reset Password View -->
                <form id="password-view" class="auth-view">
                    <div class="password-header">
                        <h2 id="password-view-title">Set Password</h2>
                        <p id="password-view-desc">Create a strong password for your account.</p>
                    </div>
                    <div class="input-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" placeholder="••••••••" required>
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary" id="set-password-btn">
                        <span class="btn-text">Save Password</span>
                        <div class="loader"></div>
                    </button>
                </form>

                <!-- Forgot Password View -->
                <form id="forgot-password-view" class="auth-view">
                    <div class="input-group">
                        <label for="forgot-email">Email Address</label>
                        <input type="email" id="forgot-email" placeholder="name@company.com" required>
                    </div>
                    <button type="submit" class="btn-primary" id="forgot-btn">
                        <span class="btn-text">Send Reset Link</span>
                        <div class="loader"></div>
                    </button>
                    <p class="footer-text"><a href="#" id="back-to-login" class="text-link">Back to Sign In</a></p>
                </form>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">
        <span id="toast-message"></span>
        <button class="toast-close">&times;</button>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
